name: Publish dev.to drafts

on:
    schedule:
        - cron: "0 6 * * *"
    workflow_dispatch:

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Publish every draft
              env:
                  KEY: ${{ secrets.DEVTO_API_KEY }}
              # dev.to re-reads `published` from the article's own frontmatter on every
              # save (forem app/models/article.rb, evaluate_front_matter), so the API
              # field alone gets overwritten. Flip it in the body too. The RSS importer
              # always writes `published: false` into line 3, so first-match is enough.
              run: |
                  curl -sSf -H "api-key: $KEY" 'https://dev.to/api/articles/me/unpublished?per_page=1000' \
                    | jq -c '.[] | {id, title, article: {published: true, body_markdown: (.body_markdown | sub("published: false"; "published: true"))}}' \
                    > drafts.jsonl
                  echo "$(wc -l < drafts.jsonl) draft(s)"

                  # Via a file, not a pipe: a `while` on the right of a pipe runs in a
                  # subshell and `failed` would not survive the loop.
                  failed=0
                  while read -r row; do
                      id=$(jq -r .id <<<"$row")
                      title=$(jq -r .title <<<"$row")
                      code=$(jq -c '{article}' <<<"$row" \
                        | curl -s -o resp.json -w '%{http_code}' -X PUT -H "api-key: $KEY" \
                            -H 'content-type: application/json' -d @- \
                            "https://dev.to/api/articles/$id")

                      # One article dev.to refuses must not strand the rest, so report
                      # the body it sent back and keep going.
                      if [ "$code" = 200 ]; then
                          echo "ok    $id  $title"
                      else
                          echo "FAIL  $id  $title  [$code] $(cat resp.json)"
                          failed=1
                      fi
                      sleep 3
                  done < drafts.jsonl

                  exit $failed
